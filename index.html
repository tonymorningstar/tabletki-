<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5f0e5">
<title>Трекер таблеток</title>
<style>
:root{--paper:#fbf8ef;--ink:#25251f;--muted:#77776d;--line:#d8d2c4;--red:#c5372f;--blue:#375c91;--shadow:0 8px 28px #29251a12}
*{box-sizing:border-box} body{margin:0;background:#e9e4d9;color:var(--ink);font-family:Georgia,'Times New Roman',serif;padding:20px}
.app{max-width:1120px;margin:0 auto;background:var(--paper);padding:clamp(16px,3vw,32px);border:1px solid #d6cfbf;box-shadow:var(--shadow);position:relative}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:22px}
h1{font-size:clamp(24px,4vw,36px);margin:0;font-weight:700;letter-spacing:.01em}.subtitle{font:12px/1.4 Arial,sans-serif;color:var(--muted);margin-top:5px}
.actions{display:flex;gap:8px;align-items:center;font:14px Arial,sans-serif}.actions button,.yearbox button{border:1px solid #bcb5a6;background:#fffdf7;color:var(--ink);padding:8px 11px;border-radius:7px;cursor:pointer}.actions button:hover,.yearbox button:hover{background:#eee7d8}.yearbox{display:flex;gap:8px;align-items:center;font:16px Arial,sans-serif}.yearbox strong{min-width:48px;text-align:center}
.section-title{font:700 12px Arial,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#6c6a60;margin:0 0 12px}.top-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 22px}.bottom-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 22px}.month{min-width:0;border-top:3px solid var(--ink);padding-top:9px}.month h3{font-size:23px;margin:0 0 10px;font-weight:700}.weekday,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}.weekday span{text-align:center;font:10px Arial,sans-serif;color:var(--muted);padding:4px 0}.day{position:relative;min-width:0;aspect-ratio:1/1;border:1px solid transparent;background:transparent;border-radius:4px;display:flex;align-items:center;justify-content:center;padding:0;color:var(--ink);font:13px Arial,sans-serif;cursor:pointer;touch-action:manipulation}.day:hover{border-color:#bcb5a6;background:#fffdf8}.day.blank{pointer-events:none}.day.today{border-color:#9a9588}.day .num{position:absolute;top:4px;left:4px;font-size:10px;color:#6e6a60}.mark{font:700 23px/1 Arial,sans-serif;color:var(--red);margin-top:7px;letter-spacing:-4px;transform:rotate(-7deg);white-space:nowrap}.mark.double{font-size:17px;letter-spacing:-3px}.day.marked{background:#fff9f1}.day:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.notes{grid-column:2/4;border-top:3px solid var(--ink);padding-top:10px}.notes h3{font-size:20px;margin:0 0 8px}.notes textarea{width:100%;min-height:88px;resize:vertical;border:0;border-bottom:1px solid var(--line);background:repeating-linear-gradient(to bottom,transparent 0,transparent 26px,#ddd6c8 27px);font:16px/27px Georgia,serif;padding:0 6px;color:var(--ink);outline:none}.notes textarea:focus{border-bottom-color:#8b8475}.divider{height:1px;background:#d8d2c4;margin:30px 0 24px}.hint{font:12px/1.5 Arial,sans-serif;color:var(--muted);margin:14px 0 0}.popup{position:fixed;z-index:20;display:none;min-width:176px;background:#fffdf7;border:1px solid #bcb5a6;border-radius:10px;box-shadow:0 8px 28px #0002;padding:8px;gap:6px;font:13px Arial,sans-serif}.popup.show{display:grid}.popup-title{font-weight:700;padding:5px 7px 7px;border-bottom:1px solid #e4ded1}.popup button{display:flex;align-items:center;gap:10px;text-align:left;border:0;background:transparent;border-radius:6px;padding:8px;cursor:pointer;color:var(--ink)}.popup button:hover{background:#f0eadf}.samplemark{display:inline-flex;justify-content:center;min-width:26px;color:var(--red);font:700 22px Arial,sans-serif}.samplemark.double{font-size:17px;letter-spacing:-3px}.popup .remove{color:#8b3a34}.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#26251f;color:#fff;padding:10px 14px;border-radius:8px;font:13px Arial,sans-serif;display:none;z-index:30}.footer{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:24px;padding-top:12px;border-top:1px solid var(--line);font:12px Arial,sans-serif;color:var(--muted)}
@media(max-width:720px){body{padding:0}.app{padding:17px 12px;border-left:0;border-right:0}.top-grid,.bottom-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 14px}.notes{grid-column:1/-1}.month h3{font-size:20px}.day{font-size:12px}.day .num{font-size:9px;top:3px;left:3px}.mark{font-size:20px}.mark.double{font-size:15px}.actions{width:100%;justify-content:flex-end}}
@media(max-width:380px){.top-grid,.bottom-grid{grid-template-columns:1fr}.notes{grid-column:auto}.month{max-width:100%}.day{aspect-ratio:1.08}.actions button{padding:7px 9px}}
</style>
</head>
<body>
<main class="app">
 <header class="topbar"><div><h1>Трекер таблеток</h1><div class="subtitle">Нажми на дату, чтобы поставить или убрать отметку</div></div><div class="actions"><div class="yearbox"><button id="prevYear" aria-label="Предыдущий год">‹</button><strong id="yearLabel">2026</strong><button id="nextYear" aria-label="Следующий год">›</button></div><button id="exportBtn">Экспорт</button><button id="resetBtn">Очистить</button></div></header>
 <p class="section-title">Гино-Тардиферон</p>
 <section class="top-grid" id="topMonths"></section>
 <div class="divider"></div>
 <p class="section-title">Вигантол</p>
 <section class="bottom-grid" id="bottomMonths"></section>
 <p class="hint">Одна отметка — большой крест. Две отметки — два маленьких креста. Данные сохраняются в этом браузере автоматически.</p>
 <footer class="footer"><span>Локальное сохранение включено</span><span id="saveStatus">Все изменения сохранены</span></footer>
</main>
<div class="popup" id="popup" role="dialog" aria-label="Выбрать отметку"><div class="popup-title" id="popupTitle">Отметка</div><button data-mark="1"><span class="samplemark">×</span><span>Одна отметка</span></button><button data-mark="2"><span class="samplemark double">××</span><span>Две отметки</span></button><button class="remove" data-mark="0"><span class="samplemark">—</span><span>Убрать отметку</span></button></div>
<div class="toast" id="toast" role="status"></div>
<script>
(() => {
 const MONTHS=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
 const SHORTDAYS=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
 const topSpec=[7,8,9,10]; // Aug–Nov, fourth month wraps beneath first
 const bottomSpec=[8,9,10];
 const $=id=>document.getElementById(id); let year=2026, active=null, marks=loadMarks(), toastTimer;
 function loadMarks(){try{return JSON.parse(localStorage.getItem('pill-tracker-marks-v1')||'{}')}catch(e){return {}}}
 function save(){try{localStorage.setItem('pill-tracker-marks-v1',JSON.stringify(marks));$('saveStatus').textContent='Сохранено автоматически'}catch(e){$('saveStatus').textContent='Браузер не разрешил локальное сохранение'}}
 function key(group,month,day){return `${group}-${year}-${month}-${day}`}
 function renderMonth(group,month){
  const article=document.createElement('article');article.className='month';
  const h=document.createElement('h3');h.textContent=MONTHS[month];article.append(h);
  const weekdays=document.createElement('div');weekdays.className='weekday';SHORTDAYS.forEach(d=>{const s=document.createElement('span');s.textContent=d;weekdays.append(s)});article.append(weekdays);
  const days=document.createElement('div');days.className='days';
  const first=(new Date(year,month,1).getDay()+6)%7, count=new Date(year,month+1,0).getDate();
  for(let i=0;i<first;i++){const b=document.createElement('div');b.className='day blank';b.setAttribute('aria-hidden','true');days.append(b)}
  for(let d=1;d<=count;d++){
   const k=key(group,month+1,d),btn=document.createElement('button');btn.type='button';btn.className='day';btn.dataset.key=k;btn.dataset.group=group;btn.dataset.month=month+1;btn.dataset.day=d;
   btn.setAttribute('aria-label',`${d} ${MONTHS[month]} ${year}, ${group==='gino'?'Гино-Тардиферон':'Вигантол'}`);
   const num=document.createElement('span');num.className='num';num.textContent=d;btn.append(num);
   if(marks[k]){btn.classList.add('marked');const m=document.createElement('span');m.className='mark'+(marks[k]===2?' double':'');m.textContent=marks[k]===2?'××':'×';btn.append(m);btn.setAttribute('aria-pressed','true')}else btn.setAttribute('aria-pressed','false');
   btn.addEventListener('click',e=>openPopup(btn,k,`${d} ${MONTHS[month]}`));days.append(btn);
  }
  article.append(days);return article;
 }
 function render(){ $('yearLabel').textContent=year;$('topMonths').replaceChildren();$('bottomMonths').replaceChildren();[7,8,9,10].forEach(m=>$('topMonths').append(renderMonth('gino',m)));[8,9,10].forEach(m=>$('bottomMonths').append(renderMonth('vigan',m)));closePopup(); }
 function openPopup(btn,k,label){active={key:k,btn};const p=$('popup');$('popupTitle').textContent=label;p.classList.add('show');const r=btn.getBoundingClientRect();const pw=190,ph=158;let left=Math.min(window.innerWidth-pw-8,Math.max(8,r.left+r.width/2-pw/2));let top=r.bottom+7;if(top+ph>window.innerHeight-8)top=r.top-ph-7;if(top<8)top=8;p.style.left=left+'px';p.style.top=top+'px';}
 function closePopup(){ $('popup').classList.remove('show');active=null }
 $('popup').addEventListener('click',e=>{const b=e.target.closest('button[data-mark]');if(!b||!active)return;const value=Number(b.dataset.mark);if(value===0)delete marks[active.key];else marks[active.key]=value;save();render();showToast(value===0?'Отметка убрана':value===1?'Поставлен один крест':'Поставлены два креста')});
 document.addEventListener('click',e=>{if(!$('popup').contains(e.target)&&!e.target.closest('.day'))closePopup()});
 document.addEventListener('keydown',e=>{if(e.key==='Escape')closePopup()});window.addEventListener('resize',closePopup);window.addEventListener('scroll',closePopup,true);
 $('prevYear').addEventListener('click',()=>{year--;render()});$('nextYear').addEventListener('click',()=>{year++;render()});
 $('resetBtn').addEventListener('click',()=>{if(confirm('Удалить все отметки во всех месяцах и годах?')){marks={};save();render();showToast('Все отметки удалены')}});
 $('exportBtn').addEventListener('click',()=>{const blob=new Blob([JSON.stringify({year,marks},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='treker-tabletok.json';a.click();URL.revokeObjectURL(url);showToast('Файл с отметками экспортирован')});
 function showToast(text){const t=$('toast');t.textContent=text;t.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.style.display='none',1800)}
 render();
})();
</script>
</body></html>
